name: R-CMD-check

on:
  workflow_dispatch:
    inputs:
      runner_set:
        description: "Which runners to use"
        type: choice
        required: true
        default: ubuntu
        options:
          - ubuntu
          - all
  # push:
  #    branches: main

permissions:
  contents: read

jobs:
  R-CMD-check-auto:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    if: github.event_name != 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}

    env:
      PROJR_TEST_LIVE_GITHUB: 'false'
      R_KEEP_PKG_SOURCE: yes
      R_PKG_TEST_LITE: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  R-CMD-check-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.config.os }}
    name: "All OS's - ${{ matrix.config.os }} (${{ matrix.config.r }})"
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && (github.event.inputs.runner_set || 'ubuntu') == 'all') && '[{"os":"ubuntu-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"macos-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]' || '[{"os":"ubuntu-latest","r":"release"}]') }}

    env:
      PROJR_TEST_LIVE_GITHUB: 'false'
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
