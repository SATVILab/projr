name: R formatting

on:
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - '.air.toml'
      - '.github/workflows/format.yaml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: posit-dev/setup-air@v1
        with:
          version: '0.13.0'
      - run: air format --check R tests
