url: https://satvilab.github.io/projr/
template:
  bootstrap: 5
  bslib:
    primary: "#006b5a"
    fg: "#172f33"
    bg: "#fcfcf9"
    navbar-light-bg: "#f4f7f2"
    base_font: "Roboto, system-ui, sans-serif"
    heading_font: "DM Sans, system-ui, sans-serif"

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
    articles:
      text: Guides
      menu:
      - text: Project configuration
        href: articles/configuration.html
      - text: Scripts and hooks
        href: articles/scripts-and-hooks.html
      - text: Archive files
        href: articles/send-to-remotes.html
      - text: Restore files
        href: articles/restore-artifacts.html
      - text: All guides
        href: articles/index.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/SATVILab/projr
      aria-label: GitHub

